<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- ctrlXref application icon: a light blue Ctrl keycap labelled "Xref". -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- key body, seen from slightly above: the lower band is its front side -->
  <rect x="10" y="14" width="236" height="232" rx="42" fill="url(#side)"/>
  <!-- key top -->
  <rect x="26" y="20" width="204" height="190" rx="32" fill="url(#top)" stroke="#bae6fd" stroke-width="3"/>
  <text x="48" y="80" font-family="Segoe UI" font-weight="600" font-size="46" fill="#0369a1">Ctrl</text>
  <text x="128" y="178" text-anchor="middle" font-family="Segoe UI" font-weight="700" font-size="80" fill="#0c4a6e"><tspan fill="#0369a1">X</tspan>ref</text>
</svg>
