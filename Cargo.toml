[package]
name = "ctrlxref"
# The displayed version comes from version.txt, which build.rs bumps daily.
version = "0.5.8"
edition = "2024"
default-run = "ctrlxref"

[dependencies]
anyhow = "1.0.104"
# OpenGL (glow) renderer only: no wgpu, so no DirectX. Without "clipboard", copied text stays
# inside the application and never reaches the system clipboard.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard"] }
# Only to get the symbol fonts, which eframe has no feature for. Without them, symbols like the
# warning sign and the theme button's sun and moon are drawn as empty boxes.
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
# "image" and the "png" decoder: the help pages' screenshots, built into the binary.
egui_extras = { version = "0.37.0", default-features = false, features = ["image"] }
egui_commonmark = { version = "0.26.0", default-features = false, features = ["pulldown_cmark"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
regex = "1"
rfd = "0.17.2"
# preserve_order: exported keys stay in the table's column order.
serde_json = { version = "1", features = ["preserve_order"] }
xmltree = { version = "0.12.0", features = ["attribute-order"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
