[package]
name = "ctrlxref"
# The displayed version comes from version.txt, which build.rs bumps daily.
version = "0.5.1"
edition = "2024"
default-run = "ctrlxref"

[dependencies]
anyhow = "1.0.104"
# OpenGL (glow) renderer only: no wgpu, so no DirectX.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui_extras = { version = "0.37.0", default-features = false }
egui_commonmark = { version = "0.26.0", default-features = false, features = ["pulldown_cmark"] }
image = { version = "0.25", default-features = false, features = ["ico"] }
rfd = "0.17.2"
xmltree = { version = "0.12.0", features = ["attribute-order"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
